# config/config.yaml
# Configuração central do Puck
audio:
  sample_rate: 44100 # Taxa de amostragem do microfone (Hz)
  chunk_size: 1024 # Tamanho do buffer de leitura
  clap_threshold: 3000 # Limiar de amplitude para detectar palma
  double_clap_interval_ms: 800 # Janela máxima entre duas palmas (ms)

apps:
  vscode:
    display_name: "VS Code"
    path: "C:/Users/wkrod/AppData/Local/Programs/Microsoft VS Code/Code.exe"

  spotify:
    display_name: "Spotify"
    path: "C:/Users/wkrod/AppData/Roaming/Spotify/Spotify.exe"

  chrome:
    display_name: "Google Chrome"
    path: "C:/Program Files/Google/Chrome/Application/chrome.exe"

  opera:
    display_name: "Opera GX"
    path: "C:/Users/wkrod/AppData/Local/Programs/Opera GX/opera.exe"

  wps_writer:
    display_name: "WPS Writer"
    path: "C:/Program Files (x86)/Kingsoft/WPS Office/ksolaunch.exe"

  steam:
    display_name: "Steam"
    path: "C:/Program Files (x86)/Steam/steam.exe"

  terminal:
    display_name: "Windows Terminal"
    path: "wt.exe" # Disponível no PATH do Windows por padrão

# ─────────────────────────────────────────────
# MODOS DE TRABALHO
# Cada modo define quais apps serão abertos automaticamente.
# Os nomes em "apps" devem corresponder às chaves acima.
# ─────────────────────────────────────────────
modes:
  ads:
    display_name: "Modo ADS"
    apps:
      - vscode
      - spotify

  estudo:
    display_name: "Modo Estudo"
    apps:
      - wps_writer
      - spotify
      - opera

  gamer:
    display_name: "Modo Gamer"
    apps:
      - steam

# ─────────────────────────────────────────────
# MODO PADRÃO
# Qual modo será ativado ao detectar duas palmas?
# Pode ser sobrescrito via argumento de linha de comando no futuro.
# ─────────────────────────────────────────────
default_mode: ads

# ─────────────────────────────────────────────
# CONFIGURAÇÕES DE LOG
# ─────────────────────────────────────────────
logging:
  level: INFO # DEBUG, INFO, WARNING, ERROR
  log_to_file: true
  log_filename: "puck.log"

# ─────────────────────────────────────────────
# PLACEHOLDERS PARA EXPANSÃO FUTURA
# Estas seções não fazem nada na V1 — existem para documentar
# que o sistema já prevê estes módulos.
# ─────────────────────────────────────────────
ai:
  enabled: false
  provider: "ollama" # ollama | openai
  model: "llama3"

api:
  enabled: false
  host: "0.0.0.0"
  port: 8000

database:
  enabled: false
  type: "sqlite" # sqlite | postgresql
